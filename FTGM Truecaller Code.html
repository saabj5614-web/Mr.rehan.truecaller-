<style>
  :root {
    --bg: #0b0f19;
    --card-bg: #151b2c;
    --fg: #f1f5f9;
    --muted: #64748b;
    --border: #242f49;
    --primary: #38bdf8;
    --primary-hover: #0ea5e9;
    --success: #10b981;
    --danger: #ef4444;

  * { box-sizing: border-box; margin: 0; padding: 0; }

    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  header {
    background: #0d1321;
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    max-width: 600px; margin: 0 auto;
    padding: 1rem;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: .5rem; }
  .brand-mark { color: var(--primary); font-size: 1.2rem; }
  .brand-name {
    font-weight: 700; font-size: 1.1rem;
    letter-spacing: -.02em;
  }
  .status {
    display: inline-flex; align-items: center; gap: .4rem;
    color: var(--success); font-size: .75rem; font-weight: 600;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--success);
    box-shadow: 0 0 8px var(--success);
  }

  /* Layout */
  main { max-width: 500px; width: 100%; margin: 0 auto; padding: 2rem 1rem; flex: 1; }

  .card {
    border-radius: 1rem;
    background: var(--card-bg);
    border: 1px solid var(--border);
    padding: 1.5rem;
  }

  /* Hero */
  .hero { text-align: center; margin-bottom: 1.5rem; }
  h1.title { font-weight: 800; font-size: 1.5rem; margin-bottom: .25rem; }
  .subtitle { color: var(--muted); font-size: .85rem; }

  /* Input */
  .field { margin-top: 1rem; }
  .field-label {
    display: flex; align-items: center; gap: .4rem;
    color: var(--muted); font-size: .75rem; font-weight: 600;
    text-transform: uppercase; margin-bottom: .5rem;
  }
  .input-wrap {
    display: flex; align-items: center;
    border-radius: .5rem;
    background: rgba(0,0,0,0.2); border: 1px solid var(--border);
    overflow: hidden;
  }
  .prefix {
    padding: .75rem 1rem;
    background: rgba(255,255,255,0.03);
    border-right: 1px solid var(--border);
    color: var(--primary); font-family: var(--font-mono); font-weight: 700;
  }
  #phoneNumber {
    flex: 1; background: transparent; border: 0; outline: 0;
    padding: .75rem; font-family: var(--font-mono);
    font-size: 1rem; color: var(--fg);
  }
  #phoneNumber::placeholder { color: #475569; }

  /* Buttons */
  .actions { display: flex; flex-direction: column; gap: .5rem; margin-top: 1rem; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: .5rem; padding: .75rem; border-radius: .5rem;
    font-weight: 600; font-size: .9rem;
    cursor: pointer; border: 1px solid transparent;
    transition: background .2s, border-color .2s;
  }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .btn-primary {
    background: var(--primary);
    color: #0b0f19;
  }
  .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
  .btn-ghost {
    background: transparent; border-color: var(--border); color: var(--muted);
  }
  .btn-ghost:hover { color: var(--fg); border-color: var(--muted); }
  .btn-accent {
    background: rgba(56,189,248,0.05); border-color: rgba(56,189,248,0.2); color: var(--primary); text-decoration: none;
  }
  .btn-accent:hover { background: rgba(56,189,248,0.1); }

  /* Error */
  .error {
    display: none; align-items: center; gap: .5rem;
    padding: .75rem; margin-top: 1rem;
    border-radius: .5rem; border: 1px solid rgba(239,68,68,0.2);
    background: rgba(239,68,68,0.05); color: var(--danger); font-weight: 500; font-size: .85rem;
  }
  .error.show { display: flex; }

  /* Result */
  .result { display: none; margin-top: 1.5rem; position: relative; }
  .result.show { display: block; }
  .result-inner {
    border-radius: .75rem; border: 1px solid var(--border);
    background: rgba(255,255,255,0.01);
    padding: 1.25rem;
  }
  .result-header {
    display: flex; align-items: center; gap: .4rem;
    color: var(--primary); font-size: .75rem; font-weight: 700;
    text-transform: uppercase; margin-bottom: 1rem;
  }
  .owner {
    display: flex; align-items: center; gap: .75rem;
    padding: 1rem; border-radius: .5rem;
    background: rgba(0,0,0,0.15); border: 1px solid var(--border);
    margin-bottom: .75rem;
  }
  .avatar {
    width: 2.5rem; height: 2.5rem; border-radius: .5rem;
    display: grid; place-items: center;
    background: rgba(56,189,248,0.1); color: var(--primary);
    font-size: 1.1rem;
  }
  .owner-label { font-size: .65rem; font-weight: 600; color: var(--muted); text-transform: uppercase; }
  .owner-name { font-weight: 700; font-size: 1.2rem; }
  
  .meta {
    display: flex; align-items: center; gap: .75rem;
    padding: 1rem; border-radius: .5rem;
    background: rgba(0,0,0,0.15); border: 1px solid var(--border);
  }
  .meta-icon {
    width: 2.5rem; height: 2.5rem;
    display: grid; place-items: center; border-radius: .5rem;
    background: rgba(255,255,255,0.03); color: var(--muted);
  }
  .meta-label { font-size: .65rem; font-weight: 600; color: var(--muted); text-transform: uppercase; }
  .meta-value { font-size: 1rem; font-weight: 700; }
  .net-jazz { color: #ff8a3d; }
  .net-zong { color: #22c55e; }
  .net-ufone { color: #a855f7; }
  .net-telenor { color: #38bdf8; }
  .net-unknown { color: var(--muted); }

  /* Loading Spinner */
  .loading {
    display: none; position: absolute; inset: 0; z-index: 20;
    align-items: center; justify-content: center; flex-direction: column;
    gap: .75rem; border-radius: .75rem;
    background: rgba(21,27,44,0.95);
  }
  .loading.show { display: flex; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid rgba(56,189,248,0.1);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text {
    font-size: .75rem; font-weight: 600; color: var(--primary);
    text-transform: uppercase; letter-spacing: .1em;
  }

  /* Footer */
  footer {
    padding: 1.5rem 1rem;
    border-top: 1px solid var(--border); margin-top: auto;
    text-align: center; font-size: .8rem; color: var(--muted);
  }
  .footer-inner { display: flex; flex-direction: column; align-items: center; gap: .75rem; }
  .socials { display: flex; gap: .5rem; }
  .socials a {
    width: 2rem; height: 2rem; border-radius: .25rem;
    display: grid; place-items: center;
    background: rgba(255,255,255,0.02); border: 1px solid var(--border);
    color: var(--muted); text-decoration: none;
  }
  .socials a:hover { color: var(--fg); border-color: var(--muted); }
</style>
</head>

"Monaco","378":"San Marino","380":"Ukraine","381":"Serbia","382":"Montenegro","383":"Kosovo","385":"Croatia","386":"Slovenia","387":"Bosnia and Herzegovina","389":"North Macedonia","420":"Czech Republic","421":"Slovakia","423":"Liechtenstein","500":"Falkland Islands","501":"Belize","502":"Guatemala","503":"El Salvador","504":"Honduras","505":"Nicaragua","506":"Costa Rica","507":"Panama","508":"Saint Pierre and Miquelon","509":"Haiti","590":"Guadeloupe","591":"Bolivia","592":"Guyana","593":"Ecuador","594":"French Guiana","595":"Paraguay","596":"Martinique","597":"Suriname","598":"Uruguay","599":"Caribbean Netherlands","670":"East Timor","672":"Norfolk Island","673":"Brunei","674":"Nauru","675":"Papua New Guinea","676":"Tonga","677":"Solomon Islands","678":"Vanuatu","679":"Fiji","680":"Palau","681":"Wallis and Futuna","682":"Cook Islands","683":"Niue","685":"Samoa","686":"Kiribati","687":"New Caledonia","688":"Tuvalu","689":"French Polynesia","690":"Tokelau","691":"Micronesia","692":"Marshall Islands","850":"North Korea","852":"Hong Kong","853":"Macau","855":"Cambodia","856":"Laos","880":"Bangladesh","886":"Taiwan","960":"Maldives","961":"Lebanon","962":"Jordan","963":"Syria","964":"Iraq","965":"Kuwait","966":"Saudi Arabia","967":"Yemen","968":"Oman","970":"Palestine","971":"UAE","972":"Israel","973":"Bahrain","974":"Qatar","975":"Bhutan","976":"Mongolia","977":"Nepal","992":"Tajikistan","993":"Turkmenistan","994":"Azerbaijan","995":"Georgia","996":"Kyrgyzstan","998":"Uzbekistan"};

  function detectNetwork(number) {
    if (number.startsWith('92')) {
      const local = number.substring(2);
      if (local.length >= 3) {
        const p = parseInt(local.substring(0, 3), 10);
        if ((p >= 300 && p <= 309) || (p >= 320 && p <= 329)) return { name: 'Jazz', cls: 'net-jazz' };
        if ((p >= 310 && p <= 319) || (p >= 370 && p <= 371)) return { name: 'Zong', cls: 'net-zong' };
        if (p >= 330 && p <= 339) return { name: 'Ufone', cls: 'net-ufone' };
        if (p >= 340 && p <= 349) return { name: 'Telenor', cls: 'net-telenor' };
      }
    }
    return { name: 'Not From Pak', cls: 'net-unknown' };
  }
  function detectCountry(number) {
    for (let len = 3; len >= 1; len--) {
      const code = number.substring(0, len);
      if (countryCodes[code]) return { code, name: countryCodes[code] };
    }
    return { code: '—', name: 'Unknown' };
  }

  const $ = (id) => document.getElementById(id);
  const phoneInput = $('phoneNumber'), lookupBtn = $('lookupBtn'), sampleBtn = $('sampleBtn');
  const resultSection = $('resultSection'), nameDisplay = $('nameDisplay');
  const networkDisplay = $('networkDisplay'), countryDisplay = $('countryDisplay');
  const errorBox = $('errorBox'), errorText = $('errorText'), loadingOverlay = $('loadingOverlay');
  const API_BASE = 'https://faisal-ali-truecaller.ftgmhacks.workers.dev/?key=ftgm7795caller&number=';

  function showError(msg) { errorText.textContent = msg; errorBox.classList.add('show'); resultSection.classList.remove('show'); }
  function hideError() { errorBox.classList.remove('show'); }
  function setLoading(on) {
    if (on) {
      loadingOverlay.classList.add('show');
      lookupBtn.disabled = true;
      lookupBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i><span>Searching…</span>';
    } else {
      loadingOverlay.classList.remove('show');
      lookupBtn.disabled = false;
      lookupBtn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i><span>Search</span>';
    }
  }

  async function performLookup(number) {
    hideError();
    const cleaned = number.replace(/\s+/g, '').replace(/\+/g, '');
    if (!/^\d+$/.test(cleaned)) return showError('Invalid number format. Use digits only.');
    if (cleaned.length < 7) return showError('Number too short. Include country code.');

    const country = detectCountry(cleaned);
    const network = detectNetwork(cleaned);
    setLoading(true);
    resultSection.classList.add('show');

    try {
      const res = await fetch(API_BASE + encodeURIComponent(cleaned));
      const data = await res.json();
      if (data.status !== 'success' || !data.data) throw new Error(data.message || 'No data returned');
      nameDisplay.textContent = data.data.name || 'Unknown';
      networkDisplay.innerHTML = '<span class="' + network.cls + '">' + network.name + '</span>';
      countryDisplay.textContent = country.name;
    } catch (err) {
      console.error('Lookup error:', err);
      nameDisplay.textContent = '—';
      networkDisplay.innerHTML = '<span class="' + network.cls + '">' + network.name + '</span>';
      countryDisplay.textContent = country.name;
      if (err.message && err.message !== 'No data returned') showError('API Error: ' + err.message);
    } finally {
      setLoading(false);
    }
  }

  lookupBtn.addEventListener('click', () => performLookup(phoneInput.value.trim()));
  phoneInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') lookupBtn.click(); });
  phoneInput.addEventListener('input', hideError);
  sampleBtn.addEventListener('click', () => { phoneInput.value = '923036992121'; performLookup('923035992121'); });
</script>
